name: Build debug APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure required Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 2 -name sdkmanager -type f | sort -r | head -1)
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK (build artifact, for CI history)
        uses: actions/upload-artifact@v4
        with:
          name: clearscreen-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK for the release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk ClearScreen-debug.apk

      - name: Publish as a GitHub Release (single direct download link, no zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: ClearScreen debug build
          body: >
            Automatically rebuilt from the latest push to this branch.
            Download ClearScreen-debug.apk below and open it on your phone to install --
            no unzip step needed. You'll need to allow installing from this source
            the first time.
          prerelease: true
          make_latest: false
          files: ClearScreen-debug.apk
